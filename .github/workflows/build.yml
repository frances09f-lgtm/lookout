name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.LOOKOUT_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/lookout-release.jks
          cat >> android/gradle.properties <<GP
          LOOKOUT_KEYSTORE_FILE=$RUNNER_TEMP/lookout-release.jks
          LOOKOUT_KEYSTORE_PASSWORD=${{ secrets.LOOKOUT_KEYSTORE_PASSWORD }}
          LOOKOUT_KEY_ALIAS=${{ secrets.LOOKOUT_KEY_ALIAS }}
          LOOKOUT_KEY_PASSWORD=${{ secrets.LOOKOUT_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - run: flutter test || true
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} -v
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Lookout.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lookout-release-apk
          path: "build/app/outputs/flutter-apk/Lookout.apk"
