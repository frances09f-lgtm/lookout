name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified APK as a GitHub release
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.LOOKOUT_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/lookout-release.jks
          cat >> android/gradle.properties <<GP
          LOOKOUT_KEYSTORE_FILE=$RUNNER_TEMP/lookout-release.jks
          LOOKOUT_KEYSTORE_PASSWORD=${{ secrets.LOOKOUT_KEYSTORE_PASSWORD }}
          LOOKOUT_KEY_ALIAS=${{ secrets.LOOKOUT_KEY_ALIAS }}
          LOOKOUT_KEY_PASSWORD=${{ secrets.LOOKOUT_KEY_PASSWORD }}
          GP
      - run: flutter pub get
      - name: Run deterministic test suite (release gate; network-dependent smoke lives in test_live/)
        id: gate
        run: |
          set -o pipefail
          flutter test --reporter json 2>&1 | tee /tmp/test-output.jsonl
      - name: Write test parser
        if: failure()
        run: |
          cat > /tmp/parse_tests.py <<'PYEOF'
          import json
          names, failed, errs = {}, [], {}
          for line in open('/tmp/test-output.jsonl', errors='replace'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              t = e.get('type')
              if t == 'testStart':
                  names[e['test']['id']] = e['test'].get('name', '?')
              elif t == 'testDone' and e.get('result') != 'success':
                  tid = e.get('testID')
                  failed.append(names.get(tid, '?') + ' [result=' + str(e.get('result')) + '] :: ' + errs.get(tid, ''))
              elif t == 'error':
                  tid = e.get('testID')
                  msg = (str(e.get('error', '')) + ' | ' + str(e.get('stackTrace', ''))[:300])[:400]
                  if tid is None:
                      failed.append('UNATTRIBUTED ERROR: ' + msg)
                  else:
                      errs[tid] = msg
          for f in failed[:10]:
              print('::error::FAILED DETERMINISTIC TEST: ' + f)
          if not failed:
              print('::error::gate failed but no failing test parsed from json reporter')
          PYEOF

      - name: Annotate failing deterministic tests
        if: failure()
        run: |
          python3 /tmp/parse_tests.py
      - name: Run live network smoke tests (informational, never gates release)
        id: live_smoke
        continue-on-error: true
        run: flutter test test_live
      - name: Report live smoke result
        if: always()
        run: |
          if [ "${{ steps.live_smoke.outcome }}" = "success" ]; then
            echo 'LIVE SMOKE: passed (network-dependent tests green)'
          else
            echo 'LIVE SMOKE: NOT PASSED (external network dependency, e.g. free search rate-limit); reported, not gating this release'
            echo '::warning::Live network smoke tests did not pass (external dependency); release gate is the deterministic suite.'
          fi
      - name: Build APK
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9.]+).*/\1/')
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name="$APP_VERSION" -v
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Lookout.apk"
      - name: Verify production APK identity and certificate
        run: |
          APK="build/app/outputs/flutter-apk/Lookout.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee /tmp/certificate.txt
          grep -Fx 'Number of signers: 1' /tmp/certificate.txt
          CERT_SHA="$(awk '/certificate SHA-256 digest:/ {print $NF}' /tmp/certificate.txt | sort -u)"
          test "$CERT_SHA" = '21e086dd5542df3c6f3cb10318e2508517edd28d91f5a388cc3fa79f2e74bdd4'
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='com.ambi.lookout'" /tmp/badging.txt
          grep -F "versionName='1.1.22'" /tmp/badging.txt
          test "${{ github.run_number }}" -gt 304
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lookout-release-apk
          path: "build/app/outputs/flutter-apk/Lookout.apk"
      - name: Publish verified release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '' | base64 -d > /tmp/RELEASE_NOTES.md
          gh release create v1.1.22 "build/app/outputs/flutter-apk/Lookout.apk" --target "$GITHUB_SHA" --title "Lookout 1.1.22 - Store-page price reading, 12-hour times, clearer task creation" --notes-file /tmp/RELEASE_NOTES.md
